<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>双桥燕京ERP · 不合格品处理单</title>
<style>
  /* ============ 设计变量 ============ */
  :root{
    --nav-1:#0c0722; --nav-2:#150d33; --nav-line:rgba(255,255,255,.07);
    --nav-card:rgba(255,255,255,.045); --nav-txt:#c9c4e0; --nav-txt-dim:#8b85a8;
    --brand:#7c4dff; --brand-deep:#5b2fd6;
    --ink:#1a1430; --ink-2:#3b3357; --muted:#8b85a3; --muted-2:#a9a3bd;
    --line:#ece8f7; --line-2:#f4f1fb;
    --page:#f6f4fb; --white:#fff;
    --green:#12a05c; --green-bg:#e7f8ef;
    --amber:#f0a020; --amber-txt:#c07615; --amber-bg:#fdf1e0;
    --purple-soft:#efe9fd; --purple-txt:#5b34c9;
    --red:#e5484d; --red-bg:#fdecec;
    --radius:12px;
    --shadow:0 1px 2px rgba(26,20,48,.04), 0 8px 24px -12px rgba(26,20,48,.10);
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font); font-size:13px; color:var(--ink);
    background:var(--page); -webkit-font-smoothing:antialiased;
    line-height:1.6; overflow:hidden;
  }
  button{font-family:inherit;font-size:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:inherit;color:inherit;outline:none}
  svg{display:block}
  ::selection{background:#ded3ff}

  /* ============ 布局 ============ */
  .app{display:flex;height:100vh;overflow:hidden}

  /* ============ 侧边栏 ============ */
  .sidebar{
    width:246px;flex:0 0 246px;display:flex;flex-direction:column;
    background:linear-gradient(180deg,var(--nav-1) 0%,#100927 45%,var(--nav-2) 100%);
    color:var(--nav-txt);position:relative;z-index:30;
    transition:margin-left .28s cubic-bezier(.4,0,.2,1);
  }
  .sidebar::after{ /* 右侧微光边 */
    content:"";position:absolute;top:0;right:0;bottom:0;width:1px;
    background:linear-gradient(180deg,rgba(124,77,255,.35),transparent 55%);
  }
  .sb-logo{display:flex;align-items:center;gap:10px;padding:16px 14px 14px}
  .sb-logo .mark{
    width:36px;height:36px;flex:0 0 36px;border-radius:10px;
    background:linear-gradient(150deg,#8b5cff,#4a23a8);
    display:grid;place-items:center;color:#fff;font-size:17px;font-weight:700;
    box-shadow:0 4px 14px -4px rgba(124,77,255,.8), inset 0 1px 0 rgba(255,255,255,.22);
  }
  .sb-logo .txt strong{display:block;color:#fff;font-size:14.5px;letter-spacing:.4px;font-weight:600}
  .sb-logo .txt span{display:block;font-size:10px;color:var(--nav-txt-dim);letter-spacing:1.6px;margin-top:-1px}
  .sb-collapse{
    margin-left:auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
    color:var(--nav-txt-dim);border:1px solid var(--nav-line);background:rgba(255,255,255,.03);
  }
  .sb-collapse:hover{color:#fff;background:rgba(255,255,255,.08)}

  .sb-scroll{flex:1;overflow-y:auto;padding:0 10px 8px;scrollbar-width:thin}
  .sb-scroll::-webkit-scrollbar{width:6px}
  .sb-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:99px}

  .sb-group{
    display:flex;align-items:center;gap:8px;padding:9px 10px;margin:6px 0 4px;
    background:var(--nav-card);border:1px solid var(--nav-line);border-radius:10px;
    color:#efeaff;font-size:12.5px;font-weight:600;letter-spacing:.3px;cursor:pointer;
    width:100%;text-align:left;
  }
  .sb-group:hover{background:rgba(255,255,255,.075)}
  .sb-group .cnt{
    margin-left:auto;min-width:22px;height:19px;padding:0 6px;border-radius:6px;
    background:rgba(255,255,255,.10);color:#cfc7ea;font-size:11px;font-weight:600;
    display:grid;place-items:center;
  }
  .sb-group .chev{color:var(--nav-txt-dim);transition:transform .22s}
  .sb-group.collapsed .chev{transform:rotate(-90deg)}

  .sb-list{display:flex;flex-direction:column;gap:1px;padding:2px 0 6px}
  .sb-list.hide{display:none}
  .sb-item{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    padding:8px 10px;border-radius:8px;color:var(--nav-txt);font-size:12.5px;
    position:relative;transition:background .16s,color .16s;
  }
  .sb-item .no{
    flex:0 0 auto;font-size:10px;font-weight:700;color:#7b74a0;letter-spacing:.5px;
    font-variant-numeric:tabular-nums;
  }
  .sb-item .lbl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-item .dot{width:5px;height:5px;border-radius:50%;background:#ff5fa2;box-shadow:0 0 6px #ff5fa2}
  .sb-item:hover{background:rgba(255,255,255,.06);color:#fff}
  .sb-item.sub{padding-left:14px}
  .sb-item.active{
    background:linear-gradient(90deg,rgba(124,77,255,.95),rgba(91,47,214,.75));
    color:#fff;font-weight:600;
    box-shadow:0 6px 18px -8px rgba(124,77,255,.9), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .sb-item.active .no{color:rgba(255,255,255,.72)}
  .sb-item.parent{gap:8px;color:#b9b3d2}
  .sb-item.parent .lbl{font-size:12.5px}
  .sb-item.parent .chev{margin-left:auto;color:var(--nav-txt-dim);transition:transform .22s}
  .sb-item.parent.closed .chev{transform:rotate(-90deg)}

  .sb-foot{border-top:1px solid var(--nav-line);padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
  .sb-foot a{
    display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;
    color:var(--nav-txt-dim);font-size:11.5px;text-decoration:none;
  }
  .sb-foot a:hover{background:rgba(255,255,255,.05);color:#ddd8ef}

  /* ============ 主区 ============ */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--page)}

  .topbar{
    height:56px;flex:0 0 56px;display:flex;align-items:center;gap:14px;
    padding:0 18px;background:var(--white);border-bottom:1px solid var(--line);
  }
  .sb-toggle{
    width:30px;height:30px;border-radius:8px;display:none;place-items:center;color:var(--ink-2);
    border:1px solid var(--line);
  }
  .search{
    display:flex;align-items:center;gap:8px;flex:0 1 420px;height:34px;
    background:#f7f5fc;border:1px solid var(--line);border-radius:9px;padding:0 10px;
    color:var(--muted);transition:border-color .16s,background .16s;
  }
  .search:focus-within{border-color:#cdbdfb;background:#fff;box-shadow:0 0 0 3px rgba(124,77,255,.09)}
  .search input{flex:1;border:none;background:none;font-size:12.5px;color:var(--ink)}
  .search input::placeholder{color:#a9a3bd}
  .search .kbd{
    font-size:10px;color:#a9a3bd;border:1px solid var(--line);background:#fff;
    border-radius:5px;padding:1px 5px;line-height:1.4;
  }
  .btn-publish{
    height:32px;padding:0 14px;border-radius:8px;font-size:12.5px;font-weight:600;
    color:#fff;background:linear-gradient(140deg,#8b5cff,#5b2fd6);
    box-shadow:0 6px 16px -8px rgba(124,77,255,.9);
  }
  .btn-publish:hover{filter:brightness(1.06)}

  .top-right{margin-left:auto;display:flex;align-items:center;gap:6px}
  .role-pick{
    display:flex;align-items:center;gap:7px;height:32px;padding:0 8px 0 9px;
    border-radius:9px;border:1px solid var(--line);background:#fff;color:var(--ink-2);
    font-size:12.5px;position:relative;
  }
  .role-pick:hover{border-color:#d9d0f6;background:#fbfaff}
  .role-pick .avatar-i{
    width:20px;height:20px;border-radius:50%;background:#efe9fd;color:#6b3fe0;
    display:grid;place-items:center;
  }
  .role-pick select{
    position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;
    appearance:none;border:none;
  }
  .role-pick .role-name{font-weight:600}
  .icon-btn{
    width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--ink-2);position:relative;
  }
  .icon-btn:hover{background:#f4f1fb}
  .icon-btn .badge-dot{
    position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;
    background:#ff5fa2;border:1.5px solid #fff;
  }
  .me{
    width:30px;height:30px;border-radius:50%;background:linear-gradient(150deg,#a181ff,#5b2fd6);
    color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;margin-left:4px;
  }

  .content{flex:1;overflow-y:auto;padding:0 0 28px}
  .content::-webkit-scrollbar{width:8px}
  .content::-webkit-scrollbar-thumb{background:#ddd6f0;border-radius:99px}

  .crumbs{
    display:flex;align-items:center;gap:8px;height:42px;padding:0 22px;
    font-size:12px;color:var(--muted);background:rgba(255,255,255,.6);
    border-bottom:1px solid var(--line);
  }
  .crumbs b{color:var(--ink);font-weight:600}
  .crumbs .sep{color:#cfc9e0}
  .crumbs .cur{margin-left:auto;color:var(--muted);display:flex;align-items:center;gap:6px}
  .crumbs .cur b{color:var(--ink);font-weight:600}

  .stack{padding:16px 22px 0;display:flex;flex-direction:column;gap:14px}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}

  /* 单据头 */
  .doc-head{display:flex;align-items:center;gap:10px;padding:14px 18px;flex-wrap:wrap}
  .doc-no{font-size:13.5px;font-weight:700;letter-spacing:.2px}
  .doc-no .sep{color:#cfc9e0;margin:0 6px;font-weight:400}
  .doc-no .code{font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .status-badge{
    display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:6px;
    font-size:11.5px;font-weight:600;background:var(--green-bg);color:var(--green);
  }
  .status-badge::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .status-badge.draft{background:#f1eef8;color:#7a7290}
  .status-badge.rejected{background:var(--red-bg);color:var(--red)}
  .status-badge.void{background:#f1eef8;color:#8b85a3}

  .doc-actions{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{
    height:31px;padding:0 13px;border-radius:8px;font-size:12.5px;font-weight:500;
    border:1px solid var(--line);background:#fff;color:var(--ink-2);transition:.15s;
    display:inline-flex;align-items:center;gap:6px;
  }
  .btn:hover{border-color:#d8cff6;background:#faf9ff;color:var(--ink)}
  .btn:active{transform:translateY(.5px)}
  .btn.primary{
    color:#fff;border-color:transparent;background:linear-gradient(140deg,#2b1b6b,#1a1140);
    box-shadow:0 6px 16px -10px rgba(26,17,64,.9);font-weight:600;
  }
  .btn.primary:hover{filter:brightness(1.25);background:linear-gradient(140deg,#3a2585,#221650)}
  .btn.danger{color:var(--red);border-color:#f7d9da;background:#fff6f6}
  .btn.danger:hover{background:#fdeaea;border-color:#f2bcbe}
  .btn.ghost{color:var(--muted)}
  .btn[disabled]{cursor:not-allowed;border-color:var(--line);background:#f4f1fb;color:#aaa4bd;box-shadow:none;opacity:1}
.btn.primary[disabled]{background:#e9e4f5;color:#a49dbb;border-color:transparent}
.btn.primary[disabled]:hover{filter:none;background:#e9e4f5}

  /* 审批面板 */
  .flow-head{
    display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--line-2);
  }
  .flow-head h2{font-size:14px;font-weight:700;letter-spacing:.2px}
  .flow-head .hint{margin-left:auto;font-size:11.5px;color:var(--muted-2)}
  .flow-head .bar{width:3px;height:14px;border-radius:2px;background:linear-gradient(180deg,#8b5cff,#5b2fd6)}

  .flow{list-style:none;padding:8px 18px 16px}
  .node{display:grid;grid-template-columns:34px 1fr auto;gap:0 12px;position:relative;padding:9px 0}
  .node + .node{border-top:1px dashed transparent}
  /* 时间轴竖线 */
  .node .rail{position:relative;display:flex;justify-content:center}
  .node .rail::before{
    content:"";position:absolute;top:26px;bottom:-12px;width:1px;background:#e7e2f4;
  }
  .node:last-child .rail::before{display:none}
  .node.is-done .rail::before{background:#c9ecdb}

  .marker{
    width:24px;height:24px;border-radius:50%;display:grid;place-items:center;flex:0 0 24px;
    font-size:11px;font-weight:700;position:relative;z-index:1;
    background:#f2effa;color:#9b94b5;border:1px solid #e8e3f5;
  }
  .node.is-done .marker{
    background:linear-gradient(150deg,#18b96b,#0e8f51);color:#fff;border-color:transparent;
    box-shadow:0 4px 10px -4px rgba(18,160,92,.8);
  }
  .node.is-current .marker{
    background:linear-gradient(150deg,#ffb545,#f08a10);color:#fff;border-color:transparent;
    box-shadow:0 4px 12px -4px rgba(240,138,16,.75);
  }
  .node.is-rejected .marker{background:linear-gradient(150deg,#ff7b7f,#e03b41);color:#fff;border-color:transparent}

  .body{min-width:0;padding-top:1px}
  .node-title{font-size:13px;font-weight:600;color:var(--ink);letter-spacing:.1px}
  .node.is-waiting .node-title{color:#5c5573}
  .node-meta{
    margin-top:3px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap;
  }
  .node-meta .who{color:#5f5878;font-weight:500}
  .node-meta .who.pending{color:#9b94b5;font-weight:400}
  .node-note{margin-top:7px;font-size:12px;color:var(--ink-2);line-height:1.65}
  .node-note .k{color:#6b6484}
  .node-note.empty{color:#a9a3bd}

  .pill{
    align-self:flex-start;margin-top:2px;display:inline-flex;align-items:center;gap:5px;
    height:22px;padding:0 9px;border-radius:6px;font-size:11.5px;font-weight:600;white-space:nowrap;
    background:var(--purple-soft);color:var(--purple-txt);
  }
  .pill::before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}
  .pill.wait{background:var(--amber-bg);color:var(--amber-txt)}
  .pill.current{background:#e8defe;color:#4a22bd}
  .pill.rejected{background:var(--red-bg);color:var(--red)}

  /* 当前节点高亮 */
  .node.is-current{
    background:rgba(124,77,255,.05);
    border-radius:10px;margin:2px -10px;padding:11px 10px;
    box-shadow:inset 3px 0 0 0 #7c4dff;
  }

  /* 审批操作区 */
  .act{margin-top:10px;border:1px solid #e6dffb;background:#fbfaff;border-radius:10px;padding:11px 12px}
  .act textarea{
    width:100%;min-height:62px;resize:vertical;border:1px solid #e4dcfa;border-radius:8px;
    padding:9px 10px;font-size:12.5px;background:#fff;color:var(--ink);line-height:1.65;
  }
  .act textarea:focus{border-color:#b9a3f8;box-shadow:0 0 0 3px rgba(124,77,255,.09)}
  .act .row{display:flex;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
  .act .tip{font-size:11px;color:var(--muted-2);margin-right:auto}
  .act .tip.warn{color:var(--amber-txt)}
  .btn.sm{height:28px;padding:0 12px;font-size:12px}
  .btn.ok{color:#fff;border-color:transparent;background:linear-gradient(140deg,#18b96b,#0e8f51);font-weight:600}
  .btn.ok:hover{filter:brightness(1.06);background:linear-gradient(140deg,#18b96b,#0e8f51)}
  .btn.no{color:#fff;border-color:transparent;background:linear-gradient(140deg,#f0686d,#dc3b41);font-weight:600}
  .btn.no:hover{filter:brightness(1.06);background:linear-gradient(140deg,#f0686d,#dc3b41)}
  .btn.ok[disabled],.btn.no[disabled]{background:#eeebf6;color:#aaa4bd;border-color:var(--line)}

  .flow-foot{
    display:flex;align-items:center;gap:12px;padding:10px 18px;border-top:1px solid var(--line-2);
    font-size:11.5px;color:var(--muted-2);
  }
  .flow-foot .link{color:#6b3fe0;cursor:pointer;text-decoration:none}
  .flow-foot .link:hover{text-decoration:underline}
  .flow-foot .right{margin-left:auto;display:flex;align-items:center;gap:14px}

  /* 抽屉 */
  .mask{
    position:fixed;inset:0;background:rgba(20,14,40,.32);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;
  }
  .mask.on{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;top:0;right:0;bottom:0;width:392px;background:#fff;z-index:90;
    transform:translateX(102%);transition:transform .28s cubic-bezier(.4,0,.2,1);
    display:flex;flex-direction:column;box-shadow:-18px 0 48px -20px rgba(26,20,48,.35);
  }
  .drawer.on{transform:none}
  .drawer-head{display:flex;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line-2)}
  .drawer-head h3{font-size:14px;font-weight:700}
  .drawer-head .x{margin-left:auto;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
  .drawer-head .x:hover{background:#f4f1fb;color:var(--ink)}
  .drawer-body{flex:1;overflow-y:auto;padding:16px 18px;display:flex;flex-direction:column;gap:13px}
  .field label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:5px}
  .field input,.field textarea,.field select{
    width:100%;height:34px;border:1px solid var(--line);border-radius:8px;padding:0 10px;
    font-size:12.5px;background:#fcfbff;color:var(--ink);
  }
  .field textarea{height:auto;min-height:72px;padding:8px 10px;resize:vertical;line-height:1.65}
  .field input:focus,.field textarea:focus{border-color:#b9a3f8;background:#fff;box-shadow:0 0 0 3px rgba(124,77,255,.09)}
  .field input[readonly]{background:#f6f4fb;color:var(--muted)}
  .drawer-foot{padding:13px 18px;border-top:1px solid var(--line-2);display:flex;gap:9px}
  .drawer-foot .btn{flex:1;justify-content:center;height:34px}

  /* toast */
  .toasts{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center}
  .toast{
    display:flex;align-items:center;gap:8px;background:#211a3b;color:#fff;font-size:12.5px;
    padding:9px 15px;border-radius:9px;box-shadow:0 12px 30px -12px rgba(0,0,0,.5);
    animation:tin .22s ease-out;
  }
  .toast.err{background:#3b1620}
  .toast .ic{width:15px;height:15px;flex:0 0 15px;opacity:.9}
  @keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}

  /* 抽层内确认 */
  .dialog{
    position:fixed;left:50%;top:50%;transform:translate(-50%,-46%) scale(.97);z-index:100;
    width:352px;background:#fff;border-radius:14px;padding:20px;box-shadow:0 30px 70px -24px rgba(20,14,40,.5);
    opacity:0;pointer-events:none;transition:.18s;
  }
  .dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
  .dialog h4{font-size:14px;font-weight:700;margin-bottom:7px}
  .dialog p{font-size:12.5px;color:var(--muted);line-height:1.7}
  .dialog .row{display:flex;gap:9px;margin-top:16px}
  .dialog .row .btn{flex:1;justify-content:center;height:33px}
  .btn.solid-red{color:#fff;border-color:transparent;background:linear-gradient(140deg,#ef5f64,#d5373d);font-weight:600}

  /* 响应式 */
  @media (max-width:1080px){
    .sidebar{position:fixed;inset:0 auto 0 0;margin-left:-246px;box-shadow:20px 0 60px -30px #000}
    .sidebar.open{margin-left:0}
    .sb-toggle{display:grid}
    .stack{padding:14px}
  }
</style>
</head>
<body>
<div class="app">
  <!-- ==================== 侧边栏 ==================== -->
  <aside class="sidebar" id="sidebar">
    <div class="sb-logo">
      <div class="mark">燕</div>
      <div class="txt">
        <strong>双桥燕京ERP</strong>
        <span>溯源管理系统</span>
      </div>
      <button class="sb-collapse" title="收起" onclick="document.getElementById('sidebar').classList.remove('open')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4v16M20 4v16M9 12h6"/></svg>
      </button>
    </div>

    <div class="sb-scroll">
      <!-- ERP 业务模块 -->
      <button class="sb-group" onclick="toggleGroup(this,'g1')">

<script>
/* =========================================================================
   一、可配置区（人员 / 流程） —— 待定项集中在这里，改这里即可
   ========================================================================= */
const ROLES = [
  { key:'qa',         label:'质量保证部 QA',   user:'安琪',   avatar:'安' },
  { key:'workshop-qa',label:'生产车间 QA',      user:'待定',   avatar:'待' },  // ← 待定：红线批注认为第 2 级应为生产车间 QA
  { key:'warehouse',  label:'原料库库管员',     user:'耿若尘', avatar:'耿' },
  { key:'vp',         label:'生产部门副总经理', user:'郭红星', avatar:'郭' }
];

/* 流程定义：level 序号、title 节点名、role 有权审批的角色、name 显示姓名
   注：第 1/2/4 级为截图原样；红线批注认为应由「生产部门车间质检 / 生产车间 QA /
   原料=李金芝、成品=郭红星或郝晨光」承担，确定后改 name 与 role 即可。 */
const FLOW_DEF = [
  { level:1, title:'不合格原因调查及建议采取措施',       role:'warehouse',   name:'耿若尘', dept:'原料库',
    status:'done',    time:'2026-09-02 10:00', opinion:'已确认整批隔离' },
  { level:2, title:'调查情况及建议采取措施确认',          role:'workshop-qa', name:'取样员', dept:'生产车间',
    status:'done',    time:'2026-09-02 10:00', opinion:'已确认整批隔离' },
  { level:3, title:'质量保证部审核意见',                  role:'qa',          name:'安琪',   dept:'质量保证部',
    status:'current', time:'', opinion:'' },
  { level:4, title:'相关部门意见',                        role:'qa',          name:'李金芝', dept:'相关部门',
    status:'waiting', time:'', opinion:'' },
  { level:5, title:'生产部门副总经理终审',                role:'vp',          name:'郭红星', dept:'生产部门',
    status:'waiting', time:'', opinion:'' },
  // ↓ 截图被裁掉的第 6 级，此处按 GMP 惯例补位，可删可改
  { level:6, title:'质量受权人批准（放行决策）',          role:'qa',          name:'质量受权人', dept:'质量受权人',
    status:'waiting', time:'', opinion:'' }
];

const DOC_DEF = {
  no:'QA-09-202609-018',
  status:'submitted',            // submitted | approved | rejected | void
  product:'双桥燕京 · 特制米醋',
  spec:'500ml / 瓶 × 12',
  batch:'20260901-A3',
  qty:'12,000 瓶',
  stage:'成品灌装（灌装线在线抽检）',
  reason:'抽检 30 瓶中有 4 瓶瓶盖密封不良、出现渗漏，判定为整批不合格。'
};

const KEY = 'sy-erp-nonconform-v1';

/* =========================================================================
   二、状态与持久化
   ========================================================================= */
let state = load() || { doc:{...DOC_DEF}, nodes:FLOW_DEF.map(n=>({...n})), role:'qa' };

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return null;
    const s = JSON.parse(raw);
    if(!s.nodes || !s.nodes.length) return null;
    return s;
  }catch(e){ return null; }
}
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

const now = () => {
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* =========================================================================
   三、渲染
   ========================================================================= */
const $ = id => document.getElementById(id);
const STATUS_TEXT = {
  done:'已完成', current:'当前节点', waiting:'等待前序节点', rejected:'已驳回', skipped:'已跳过'
};

const CHECK_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.6l4.4 4.4L19 7"/></svg>';
const X_SVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

function render(){
  const { doc, nodes } = state;

  // 单据头
  $('docNo').textContent = doc.no;
  const stEl = $('docStatus');
  const map = {
    submitted:['已提交',''], draft:['草稿','draft'],
    approved:['已通过',''], rejected:['已驳回','rejected'], void:['已作废','void']
  };
  const [txt, cls] = map[doc.status] || map.submitted;
  stEl.textContent = txt;
  stEl.className = 'status-badge ' + cls;

  // 流程
  const doneCount = nodes.filter(n=>n.status==='done').length;
  $('flow').innerHTML = nodes.map((n,i)=>{
    const isDone = n.status==='done', isCur = n.status==='current';
    const isRej = n.status==='rejected', isWait = n.status==='waiting';
    const isSkip = n.status==='skipped';
    const cls = isDone?'is-done':isCur?'is-current':isRej?'is-rejected':'is-waiting';
    const marker = isDone ? CHECK_SVG : isRej ? X_SVG : isSkip ? '–' : `<span>${n.level}</span>`;
    const metaWho = isDone||isRej
      ? `<span class="who">${esc(n.name)}</span><span>·</span><span>${esc(n.time)}</span>`
      : `<span class="who pending">${esc(n.name)} · 待审批</span>`;
    const note = (isDone||isRej)
      ? `<div class="node-note"><span class="k">${esc(n.title)}：</span>${esc(n.opinion||'—')}</div>`
      : `<div class="node-note empty">尚未填写本节点意见</div>`;

    const pillCls = isCur?'current':isWait?'wait':isRej?'rejected':'';
    const pillTxt = isCur?'当前节点':isWait?'等待前序节点':isRej?'已驳回':isSkip?'已终止':'已完成';

    return `
      <li class="node ${cls}" data-i="${i}">
        <div class="rail"><span class="marker">${marker}</span></div>
        <div class="body">
          <div class="node-title">${esc(n.title)}</div>
          <div class="node-meta">${metaWho}</div>
          ${note}
          ${isCur ? actPanel(i) : ''}
        </div>
        <span class="pill ${pillCls}">${pillTxt}</span>
      </li>`;
  }).join('');

  const cur = nodes.findIndex(n=>n.status==='current');
  $('footInfo').textContent = doc.status==='approved'
    ? `共 ${nodes.length} 级 · 全部审批完成，单据已通过`
    : doc.status==='rejected'
      ? `共 ${nodes.length} 级 · 第 ${(nodes.find(n=>n.status==='rejected')||{}).level||''} 级驳回，流程已中止`
      : doc.status==='void'
        ? `共 ${nodes.length} 级 · 单据已作废`
        : `共 ${nodes.length} 级 · 已完成 ${doneCount} 级 · 当前第 ${cur>=0?nodes[cur].level:'—'} 级`;

  // 按钮可用性
  const frozen = doc.status==='void' || doc.status==='rejected' || doc.status==='approved';
  $('btnAudit').disabled = frozen || cur < 0;
  $('btnSubmit').disabled = ['void','approved','rejected'].includes(doc.status);
  $('btnEdit').disabled = doc.status==='void';

  // 角色
  const r = ROLES.find(x=>x.key===state.role) || ROLES[0];
  $('roleName').textContent = r.label;
  $('crumbRole').textContent = r.label + '（' + r.user + '）';
  $('meAvatar').textContent = r.avatar;
  $('roleSel').innerHTML = ROLES.map(x=>`<option value="${x.key}" ${x.key===state.role?'selected':''}>${x.label} · ${x.user}</option>`).join('');
}

function actPanel(i){
  const n = state.nodes[i];
  const mine = n.role === state.role;
  return `
    <div class="act" id="act-${i}">
      <textarea id="op-${i}" placeholder="请填写本节点审批意见（对应「${esc(n.title)}」）"></textarea>
      <div class="row">
        <span class="tip${mine?'':' warn'}">${mine ? '本节点由你审批' : '当前角色无权审批本节点（应为 ' + roleLabel(n.role) + '）'}</span>
        <button class="btn sm no" ${mine?'':'disabled'} onclick="act(${i},'reject')">驳回</button>
        <button class="btn sm ok" ${mine?'':'disabled'} onclick="act(${i},'approve')">通过</button>
      </div>
    </div>`;
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const roleLabel = k => (ROLES.find(r=>r.key===k)||{label:k}).label;

/* =========================================================================
   四、交互
   ========================================================================= */
function setRole(key){
  state.role = key; save(); render();
  const r = ROLES.find(x=>x.key===key);
  toast('当前角色：' + r.label + ' · ' + r.user);
}

function act(i, type){
  const n = state.nodes[i];
  if(n.status !== 'current') return toast('仅当前节点可操作', true);
  if(n.role !== state.role){
    return toast(`无权审批：第 ${n.level} 级应由「${roleLabel(n.role)}」处理`, true);
  }
  const ta = $('op-'+i);
  const val = (ta.value || '').trim() || (type==='approve' ? '同意，按意见执行。' : '不同意，退回补充调查。');

  if(type==='approve'){
    n.status='done'; n.opinion=val; n.time=now();
    const nx = state.nodes[i+1];
    if(nx) nx.status='current';
    else state.doc.status='approved';
    toast(`第 ${n.level} 级已通过` + (nx ? `，流转至第 ${nx.level} 级` : '，单据已通过'));
  }else{
    n.status='rejected'; n.opinion=val; n.time=now();
    state.doc.status='rejected';
    toast(`第 ${n.level} 级已驳回，流程中止`, true);
  }
  save(); render();
}

function focusApprove(){
  const i = state.nodes.findIndex(n=>n.status==='current');
  if(i<0) return toast('当前无待审批节点', true);
  const n = state.nodes[i];
  if(n.role !== state.role){
    return toast(`当前角色不能审批第 ${n.level} 级，请切换为「${roleLabel(n.role)}」`, true);
  }
  const box = $('act-'+i);
  box.scrollIntoView({behavior:'smooth', block:'center'});
  box.style.boxShadow = '0 0 0 3px rgba(124,77,255,.18)';
  setTimeout(()=>box.style.boxShadow='', 1200);
  $('op-'+i).focus();
}

function onSubmit(){
  if(state.doc.status==='void') return toast('单据已作废，无法提交', true);
  state.doc.status='submitted'; save(); render();
  toast('已提交：单据进入审批流程');
}

/* --- 作废 / 删除 --- */
let pendingVoid = null;
function onVoid(kind){
  if(state.doc.status==='void') return toast('单据已作废', true);
  pendingVoid = kind;
  openDialog(
    kind==='delete' ? '删除单据？' : '作废单据？',
    kind==='delete'
      ? '删除后该单据将从待办与台账中移除（GMP 环境实际为逻辑删除，审计记录保留）。'
      : '作废后流程立即终止，已完成的审批意见保留不可再流转。',
    kind==='delete' ? '确认删除' : '确认作废'
  );
}
function doVoid(){
  state.doc.status='void';
  state.nodes.forEach(n=>{ if(n.status==='current') n.status='skipped'; });
  save(); render(); closeDialog();
  toast(pendingVoid==='delete' ? '单据已删除（逻辑删除）' : '单据已作废');
}

/* --- 回退 --- */
function onRollback(){
  const done = state.nodes.map((n,i)=>({n,i})).filter(x=>x.n.status==='done');
  if(!done.length) return toast('没有可回退的节点', true);
  if(state.doc.status==='void') return toast('单据已作废，无法回退', true);
  const last = done[done.length-1];
  openDialog('回退到上一节点？',
    `将撤销第 ${last.n.level} 级「${last.n.title}」的审批结果，流程回到该节点重新审批。`,
    '确认回退', () => {
      last.n.status='current'; last.n.opinion=''; last.n.time='';
      state.nodes.forEach((n,i)=>{ if(i>last.i && n.status!=='done') n.status='waiting'; });
      state.doc.status='submitted';
      save(); render(); closeDialog(); toast(`已回退至第 ${last.n.level} 级`);
    });
}

/* --- 抽屉 --- */
function openDrawer(){
  const d = state.doc;
  $('drawerBody').innerHTML = `
    <div class="field"><label>单据编号</label><input value="${esc(d.no)}" readonly></div>
    <div class="field"><label>产品名称</label><input id="f-product" value="${esc(d.product)}"></div>
    <div class="field"><label>规格</label><input id="f-spec" value="${esc(d.spec)}"></div>
    <div class="field"><label>批号</label><input id="f-batch" value="${esc(d.batch)}"></div>
    <div class="field"><label>数量</label><input id="f-qty" value="${esc(d.qty)}"></div>
    <div class="field"><label>发生环节</label><input id="f-stage" value="${esc(d.stage)}"></div>
    <div class="field"><label>不合格描述</label><textarea id="f-reason">${esc(d.reason)}</textarea></div>
  `;
  $('mask').classList.add('on'); $('drawer').classList.add('on'); $('drawer').setAttribute('aria-hidden','false');
}
function closeDrawer(){
  $('drawer').classList.remove('on'); $('drawer').setAttribute('aria-hidden','true');
  if(!$('dialog').classList.contains('on')) $('mask').classList.remove('on');
}
function saveDrawer(){
  ['product','spec','batch','qty','stage','reason'].forEach(k=>{
    const el = $('f-'+k); if(el) state.doc[k] = el.value;
  });
  save(); closeDrawer(); toast('单据明细已保存');
}
function closeAll(){ closeDrawer(); closeDialog(); }

/* --- 弹窗 --- */
let dlgCb = null;
function openDialog(title, desc, okText, cb){
  $('dlgTitle').textContent = title;
  $('dlgDesc').textContent = desc;
  $('dlgOk').textContent = okText || '确认';
  $('dialog').classList.add('on'); $('mask').classList.add('on');
  dlgCb = cb || doVoid;
}
function closeDialog(){
  $('dialog').classList.remove('on');
  if(!$('drawer').classList.contains('on')) $('mask').classList.remove('on');
  dlgCb = null;
}
$('dlgOk').addEventListener('click', ()=>{ if(dlgCb) dlgCb(); else doVoid(); });

/* --- toast --- */
function toast(msg, isErr){
  const el = document.createElement('div');
  el.className = 'toast' + (isErr ? ' err' : '');
  el.innerHTML = `<span class="ic">${isErr
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" style="width:15px;height:15px"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px"><path d="M5 12.6l4.4 4.4L19 7"/></svg>'}</span>${esc(msg)}`;
  $('toasts').appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .25s, transform .25s'; el.style.opacity=0; el.style.transform='translateY(-6px)'; setTimeout(()=>el.remove(),260); }, 2600);
  return false;
}

/* --- 侧边栏折叠 --- */
function toggleGroup(btn, id){
  btn.classList.toggle('collapsed');
  $(id).classList.toggle('hide', btn.classList.contains('collapsed'));
}
function toggleSub(btn, id){
  btn.classList.toggle('closed');
  $(id).classList.toggle('hide', btn.classList.contains('closed'));
}
document.querySelectorAll('[data-nav]').forEach(b=>{
  b.addEventListener('click', ()=>{
    const lbl = b.querySelector('.lbl').textContent;
    if(b.classList.contains('active')) return;
    toast(`「${lbl}」为示范版占位页，当前仅实现了不合格品处理单`);
  });
});

/* --- 窄屏：点主区收起侧边栏 --- */
document.querySelector('.main').addEventListener('click', ()=>{
  const sb = document.getElementById('sidebar');
  if(sb.classList.contains('open')) sb.classList.remove('open');
});

/* --- 重置 --- */
function resetDemo(){
  openDialog('重置演示数据？', '将清空本地保存的审批进度与单据修改，恢复到初始示例状态。', '确认重置', ()=>{
    localStorage.removeItem(KEY);
    state = { doc:{...DOC_DEF}, nodes:FLOW_DEF.map(n=>({...n})), role:'qa' };
    save(); render(); closeDialog(); toast('已恢复初始示例数据');
  });
}

/* --- 快捷键 --- */
document.addEventListener('keydown', e=>{
  if((e.metaKey||e.ctrlKey) && e.key.toLowerCase()==='k'){ e.preventDefault(); $('q').focus(); }
  if(e.key==='Escape') closeAll();
});

/* --- 启动 --- */
render();
</script>
